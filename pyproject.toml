[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompt-guard"
version = "0.1.0"
description = "Security layer for LLM apps — detect injection, jailbreaks, and PII"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]